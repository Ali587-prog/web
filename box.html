<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My HTML Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ff5b43;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Navigation bar */
        nav {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 35px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        /* Main section */
        .about {
            text-align: center;
            padding-top: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .line {
            width: 45px;
            height: 3px;
            background-color: white;
            margin: auto;
            margin-bottom: 22px;
        }

        .description {
            font-family: Georgia, serif;
            font-size: 16px;
        }

        .paragraph {
            color: #512b20;
            font-family: Georgia, serif;
            margin-top: 190px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    
    <nav>
        <div class="logo">My HTML Site</div>

        <div class="menu">
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Portfolio</a>
            <a href="#">Contact</a>
            <a href="gallery.html">Gallery</a>
        </div>
    </nav>

    <section class="about">

        <h1>About us</h1>

        <div class="line"></div>

        <p class="description">
            This is my new about page. Learn all about what I have going on here.
        </p>

        <p class="paragraph">
            A paragraph of text.
        </p>

    </section>
</body>
</html>
